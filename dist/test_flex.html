                      To: "translate-x-full"
                  -->
                  <div class="w-screen max-w-md" x-data="{ isOpen: false}">

                      <div class="px-4 sm:px-6">
                        <div class="flex items-start justify-between">

                                      <a href="#" class="text-indigo-600 hover:text-indigo-900">Edit</a>
                                    </td>
                                  </tr>

                              </table>
