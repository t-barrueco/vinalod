<div class="ecl-form-group">
    <label class="ecl-form-label" for="example-input-id-1">Label</label>
    <div class="ecl-help-block">Date range.</div>
    <div class="ecl-feedback-message">
    </div>
    <div class="ecl-datepicker">
        <input type="text" autoComplete="off" data-ecl-datepicker-toggle=""
        data-ecl-auto-init="Datepicker" id="start-date" name="start-date"
        class="ecl-datepicker__field ecl-text-input ecl-text-input--s" required="" placeholder="dd-mm-yyyy"
        value="dd-mm-yyyy" onblur="relatedFilters(this)"/>
        <svg class="ecl-icon ecl-icon--s ecl-datepicker__icon" focusable="false" aria-hidden="true">
            <use xlink:href="/images/icons.svg#general--calendar"></use>
        </svg>
    </div>
    <div class="ecl-datepicker">
        <input type="text" autoComplete="off" data-ecl-datepicker-toggle=""
        data-ecl-auto-init="Datepicker" id="end-date" name="end-date"
        class="ecl-datepicker__field ecl-text-input ecl-text-input--s" required="" placeholder="dd-mm-yyyy"
        value="dd-mm-yyyy" onblur="relatedFilters(this)"/>
        <svg class="ecl-icon ecl-icon--s ecl-datepicker__icon" focusable="false" aria-hidden="true">
            <use xlink:href="/images/icons.svg#general--calendar"></use>
        </svg>
    </div>
</div>
