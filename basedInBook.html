<!doctype html>
<html>
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/4.2.8/d3.min.js" type="text/JavaScript"></script>
    <style>
      .link {
        stroke: #000000;
      }

      marker {
        fill: #000000;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  </head>
  <body>
    <div id="controls">
    </div>
    <div id="viz">
      <svg style="width:1100px;height:600px;" ></svg>
    </div>
    <script>
      var roleScale = d3.scaleOrdinal()
        .domain(["contractor", "employee", "manager"])
        .range(["#75739F", "#41A368", "#FE9922"]);
    var filter="http://publications.europa.eu/resource/authority/corporate-body/PUBL",url="https://publications.europa.eu/webapi/rdf/sparql"
    var buttonFilter={"corporate-body/PUBL":{"url":"https://publications.europa.eu/webapi/rdf/sparql","filter":"http://publications.europa.eu/resource/authority/corporate-body/PUBL"},
    "corporate-body/CONSIL":{"url":"https://data.europa.eu/euodp/sparqlep","filter":"http://publications.europa.eu/resource/authority/corporate-body/CONSIL"},
    "pub-theme/G01A":{"url":"https://publications.europa.eu/webapi/rdf/sparql","filter":"http://publications.europa.eu/resource/authority/pub-theme/G01A"},
    "coronavirus-data":{"url":"https://data.europa.eu/euodp/sparqlep","filter":"http://data.europa.eu/88u/dataset/covid-19-coronavirus-data"}},prefixes=""
    
    sparqlQuery = "PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>  \
      SELECT DISTINCT ?s ?p ?o \
      where {{?s ?p ?o.} \
            bind (if(ISBLANK(?o),<LONG::bif:iri_id_num>(?o),'') as ?oID). \
            bind (if(LANG(?o),LANG(?o),'') as ?oLANG). \
            FILTER(?oLANG='en'||?oLANG='') \
            filter(?s=<"+filter+">) \
            } \
      order by DESC(?oLANG) (?p=<http://www.w3.org/2008/05/skos-xl#prefLabel>||?p=<http://www.w3.org/2008/05/skos-xl#altLabel>) ?s ?g \
      #LIMIT 25 OFFSET 0"

      var queryUrl = url + "?query=" + prefixes +  encodeURIComponent(  sparqlQuery  )+ "&format=json";
      console.log(queryUrl)
      settings = { url: queryUrl, async: true   , dataType: 'jsonp'     };
      $.ajax(settings).then  (function( _data ) {
          var results = _data.results.bindings;
          console.log(results)
          data=constructTree(results,null)
          //treeData=data.treeData
          //createForceLayout(data.flatData.nodes, data.flatData.links)
          networkGraph = new NetworkGraph("#networkGraph", data);
      })
      
      function createForceLayout(nodes,edges) {
        var marker = d3.select("svg").append('defs')
          .append('marker')
            .attr("id", "Triangle")
            .attr("refX", 12)
            .attr("refY", 6)
            .attr("markerUnits", 'userSpaceOnUse')
            .attr("markerWidth", 12)
            .attr("markerHeight", 18)
            .attr("orient", 'auto')
          .append('path')
            .attr("d", 'M 0 0 12 6 0 12 3 6');
        
        var nodeHash = {};
        nodes.forEach(node => {
          nodeHash[node.id] = node;
        });
        
        edges.forEach(edge => {
          edge.weight = parseInt(edge.weight);
          edge.source = nodeHash[edge.source];
          edge.target = nodeHash[edge.target];
        });
        
        nodes.forEach(d => {
          d.degreeCentrality = edges
            .filter(p => p.source === d || p.target === d)
            .length;
        });
        
        var linkForce = d3.forceLink();
        
        var simulation = d3.forceSimulation()
          .force("charge", d3.forceManyBody().strength(-40))
          .force("center", d3.forceCenter().x(500).y(500))
          .force("link", linkForce)
          .nodes(nodes)
          .on("tick", forceTick);
        
        simulation.force("link").links(edges);
        
        d3.select("svg").selectAll("line.link")
          .data(edges, d => `${d.source.id}-${d.target.id}`)
          .enter()
          .append("line")
            .attr("class", "link")
            .style("opacity", .5)
            .style("stroke-width", d => d.weight);
        
        d3.selectAll("line").attr("marker-end", "url(#Triangle)");
        
        var nodeEnter = d3.select("svg").selectAll("g.node")
          .data(nodes, d => d.id)
          .enter()
          .append("g")
            .attr("class", "node");
        nodeEnter.append("circle")
            .attr("r", 5)
            .attr("id",  d => removeChars(d.id))
            .style("fill", d => roleScale(d.role))
            .on('dblclick', function(d){
                console.log(this)
                wrangleData(this);
            })
        
/*         nodeEnter.append("text")
            .style("text-anchor", "middle")
            .attr("y", 15)
            .text(d => d.id); */
        
        d3.select("#controls").append("button")
          .on("click", sizeByDegree).html("Degree Size");

        function wrangleData(node) {
            console.log(treeData)
            console.log(node.getAttribute("id"))
            if (d3.select("#"+removeChars(node.getAttribute("id"))).data()[0]["children"]){
                for (let i = 0; i < treeData.length; i++) {
                    if (treeData[i]["id"]==d3.select("#"+node.getAttribute("id")).data()[0]["id"]){
                        treeData[i]._children = treeData[i].children;
                        delete treeData[i].children;
                        data=flatten(treeData).flatData
                        //////console.log(vis.data)
                        //vis.updateVis();
                        break;
                    }
                }
            }else{
                for (let i = 0; i < treeData.length; i++) {
                    if (treeData[i]["id"]==d3.select("#"+node.getAttribute("id")).data()[0]["id"]){
                        treeData[i].children = treeData[i]._children;
                        delete treeData[i]._children;
                        data=flatten(treeData).flatData
                        //////console.log(vis.data)
                        //vis.updateVis();
                        //break;
                    }
                }  
            }
        }
        function sizeByDegree() {
          simulation.stop();
          simulation.force("charge", d3.forceManyBody()
            .strength(d => -d.degreeCentrality * 20));
          simulation.restart();
          d3.selectAll("circle")
            .attr("r", d => d.degreeCentrality * 2);
        }
        
        function forceTick() {
          d3.selectAll("line.link")
              .attr("x1", d => d.source.x)
              .attr("x2", d => d.target.x)
              .attr("y1", d => d.source.y)
              .attr("y2", d => d.target.y);
          d3.selectAll("g.node")
          	  .attr("transform", d => `translate(${d.x},${d.y})`);
        }
      }
    </script>
    <script src="js/mainBook.js"></script>
    <script src="js/networkGraphBook.js"></script>
  </body>
</html>
